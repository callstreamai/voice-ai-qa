services:
  - type: web
    name: voice-ai-qa
    runtime: node
    region: virginia
    plan: starter # not free: free instances sleep and would drop in-progress reviews
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: voice-ai-qa-db, property: connectionString }
      - key: APP_PASSWORD
        sync: false
      - key: BLAND_API_KEY
        sync: false
      - key: BLAND_ACCOUNTS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUDIO_MAX_PER_REQUEST
        value: "25"
      - key: AUDIO_DAILY_CAP
        value: "200"
      - key: GEMINI_COST_PER_MIN
        value: "0.004"

databases:
  - name: voice-ai-qa-db
    region: virginia
    plan: basic-256mb
